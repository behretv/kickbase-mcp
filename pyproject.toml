[project]
name = "kickbase-mcp"
version = "0.1.0"
description = "MCP server for the Kickbase fantasy football API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.11",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.scripts]
kickbase-mcp = "kickbase_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kickbase_mcp"]

[dependency-groups]
dev = [
    "ruff>=0.8",
]
